name: Build Windows EXE

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Nuitka (windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements-build.txt') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'v*') { $v = $ref.Substring(1) } else { $v = '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $v"

      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --standalone `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --windows-icon-from-ico=launcher/assets/pyvortex.ico `
            --company-name=PyVortex `
            --product-name=PyVortex `
            --file-description="PyVortex Minecraft Launcher" `
            --file-version=${{ steps.ver.outputs.version }} `
            --product-version=${{ steps.ver.outputs.version }} `
            --output-filename=PyVortex.exe `
            --output-dir=dist_nuitka `
            main.py

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist_nuitka | Format-Table Name, Length -AutoSize

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PyVortex-windows-x64
          path: dist_nuitka/PyVortex.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_nuitka/PyVortex.exe
          generate_release_notes: true
          fail_on_unmatched_files: true